services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-datos:/data/db

  api-stable:
    image: tecnostore-api:1.0.0
    env_file: ../.env.docker

  api-canary:
    image: tecnostore-api:2.0.0
    env_file: ../.env.docker

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-stable
      - api-canary

volumes:
  mongo-datos: